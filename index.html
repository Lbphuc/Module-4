<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Gallery Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Responsive Gallery</h1>
  </header>

  <main>
    <div class="gallery">
      <!-- Figure 1 -->
      <figure>
        <img src="https://picsum.photos/id/1018/600/400" alt="Misty mountains with pine trees at sunrise">
        <figcaption>
          <p>Bình minh trên dãy núi phủ đầy sương mờ và cây lá kim xanh ngát.</p>
        </figcaption>
      </figure>

      <!-- Figure 2 -->
      <figure>
        <img src="https://picsum.photos/id/1015/600/400" alt="River winding through a green valley with rocky cliffs">
        <figcaption>
          <p>Dòng sông uốn lượn qua thung lũng xanh rì rào bên vách đá dựng đứng.</p>
        </figcaption>
      </figure>

      <!-- Figure 3 (Ở màn hình lớn sẽ chiếm trọn 2 cột) -->
      <figure>
        <img src="https://picsum.photos/id/1016/600/400" alt="Desert canyon landscape under a clear sky">
        <figcaption>
          <p>Hẻm núi đá sa thạch hùng vĩ dưới ánh mặt trời rực rỡ buổi ban trưa.</p>
        </figcaption>
      </figure>

      <!-- Figure 4 -->
      <figure>
        <img src="https://picsum.photos/id/1019/600/400" alt="Rough ocean waves crashing onto dark shoreline rocks">
        <figcaption>
          <p>Những con sóng biển xô bờ đá nhấp nhô tạo bọt trắng xóa giữa đại dương.</p>
        </figcaption>
      </figure>

      <!-- Figure 5 (Ở tablet sẽ chiếm trọn 2 cột vì là phần tử cuối) -->
      <figure>
        <img src="https://picsum.photos/id/1020/600/400" alt="Quiet lake surrounded by autumn trees and gentle hills">
        <figcaption>
          <p>Mặt hồ phẳng lặng phản chiếu sắc vàng mùa thu của rặng cây ven đồi.</p>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy; Final Project Responsive Web Design</p>
  </footer>
</body>
</html>
